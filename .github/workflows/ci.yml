name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, static analysis and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Compiles with warnings as errors, runs detekt, ktlint, every test (Testcontainers uses the runner's
      # Docker) and fails below 80% line coverage.
      - run: ./gradlew build koverVerify koverHtmlReport
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/tests/
            build/reports/kover/

  images:
    name: Container images
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [ledger/app, consumers/activity-projection, consumers/fraud-alerts]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg MODULE_DIR=${{ matrix.module }} .
