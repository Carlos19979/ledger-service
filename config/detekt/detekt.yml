# Only deviations from detekt's defaults live here.
complexity:
  # Aggregates are rebuilt from storage with every field; a builder would only hide that.
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 10
  TooManyFunctions:
    thresholdInClasses: 15
    # Spring configuration classes are lists of @Bean factories, not behaviour.
    ignoreAnnotatedFunctions: ['Bean']
performance:
  SpreadOperator:
    excludes: ['**/*Application.kt']
style:
  MagicNumber:
    excludes: ['**/test/**', '**/testFixtures/**']
  ReturnCount:
    max: 4
